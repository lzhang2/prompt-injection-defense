# Template for configs/secrets.yaml. Copy it and fill in your own keys:
#
#   cp configs/secrets.example.yaml configs/secrets.yaml
#
# secrets.yaml is git-ignored and docker-ignored: it is never committed or baked
# into an image. Jobs and the Ray cluster mount it read-only at runtime.
#
# load_config() gives each LLM section (rater, assistant) the key for its
# `provider` in configs/config.yaml. If a key here is empty, the client falls
# back to the environment variable (GEMINI_API_KEY / ANTHROPIC_API_KEY).

# provider: gemini. Get one at https://aistudio.google.com/apikey
gemini_api_key: ""

# provider: claude. Get one at https://console.anthropic.com/settings/keys
anthropic_api_key: ""
